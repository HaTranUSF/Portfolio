name: Portfolio hero fix

on:
  push:
    branches: [portfolio-hero-interactions]

permissions:
  contents: write

jobs:
  enhance-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-hero-interactions
      - name: Update hero interactions
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Remove availability labels from the actual markup.
          s = s.replace('        <div class="hero-available"><span class="sonar"></span> Open to work</div>\n', '')
          s = s.replace('          <span class="portrait-badge pb3">● Available</span>\n', '')

          # Remove the large decorative circle behind the hero.
          s = re.sub(r'\n#hero::after \{.*?\n\}', '', s, count=1, flags=re.S)

          # Add polished portrait motion without disturbing the rest of the design.
          hero_css = r'''

/* INTERACTIVE HERO PORTRAIT */
.hero-portrait { perspective: 900px; }
.portrait-shell {
  transform-style: preserve-3d;
  transition: transform 0.22s ease-out;
  will-change: transform;
}
.hero-headshot {
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}
.portrait-shell:hover .hero-headshot {
  transform: scale(1.025) translateZ(10px);
  box-shadow: 0 26px 65px rgba(0,0,0,0.40), 0 0 48px rgba(47,184,224,0.18);
}
.portrait-badge {
  z-index: 4;
  opacity: 0;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  animation: badge-arrive 1.05s cubic-bezier(.16,1,.3,1) forwards;
}
.portrait-badge:hover {
  border-color: rgba(0,212,168,0.5);
  background: rgba(3,55,77,0.94);
  box-shadow: 0 16px 38px rgba(0,0,0,0.30), 0 0 24px rgba(0,212,168,0.10);
}
.pb1 {
  --arrival-x: 72px;
  --arrival-y: 76px;
  animation-delay: 0.30s;
}
.pb2 {
  --arrival-x: -78px;
  --arrival-y: -56px;
  animation-delay: 0.48s;
}
@keyframes badge-arrive {
  0% {
    opacity: 0;
    transform: translate(var(--arrival-x), var(--arrival-y)) rotate(-12deg) scale(0.68);
  }
  68% {
    opacity: 1;
    transform: translate(0, 0) rotate(3deg) scale(1.06);
  }
  100% {
    opacity: 1;
    transform: translate(0, 0) rotate(0) scale(1);
  }
}
.portrait-badge.badge-settled {
  opacity: 1;
  animation: badge-float 4s ease-in-out infinite;
}
.pb2.badge-settled { animation-delay: -1.7s; }
@keyframes badge-float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -6px; }
}
@media (prefers-reduced-motion: reduce) {
  .portrait-shell { transition: none; transform: none !important; }
  .portrait-badge { opacity: 1; animation: none !important; translate: none !important; }
  .hero-headshot { transition: none; }
}
'''
          if '/* INTERACTIVE HERO PORTRAIT */' not in s:
              s = s.replace('\n  </style>', hero_css + '\n  </style>', 1)

          hero_js = r'''

    // Interactive hero portrait: subtle pointer tilt plus a one-time badge entrance.
    const portraitShell = document.querySelector('.portrait-shell');
    const portraitBadges = document.querySelectorAll('.portrait-badge');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (portraitShell && !reducedMotion) {
      portraitShell.addEventListener('pointermove', (e) => {
        const rect = portraitShell.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        portraitShell.style.transform = `rotateX(${(-y * 9).toFixed(2)}deg) rotateY(${(x * 9).toFixed(2)}deg)`;
      });
      portraitShell.addEventListener('pointerleave', () => {
        portraitShell.style.transform = 'rotateX(0deg) rotateY(0deg)';
      });
      portraitBadges.forEach((badge, index) => {
        badge.addEventListener('animationend', (event) => {
          if (event.animationName === 'badge-arrive') {
            window.setTimeout(() => badge.classList.add('badge-settled'), index * 120);
          }
        }, { once: true });
      });
    } else {
      portraitBadges.forEach(badge => badge.classList.add('badge-settled'));
    }
'''
          if '// Interactive hero portrait:' not in s:
              s = s.replace('\n    const treasureFacts = [', hero_js + '\n    const treasureFacts = [', 1)

          path.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish hero portrait interactions"
          git push origin HEAD:portfolio-hero-interactions
